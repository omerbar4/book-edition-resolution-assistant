# Local only. Binds to 127.0.0.1. No secrets, no external services.
# The image runs the public-demo profile (BERA_PUBLIC_DEMO=1): Open Library catalog built into
# the image and opened read-only, LLM disabled, no docs/feedback/labeling routes, rate limit,
# nothing written to disk (only /tmp, a tmpfs here).
# For local LLM experiments run the app outside this image (see README); the public-demo
# profile refuses to start with an LLM provider configured.
services:
  bera:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
