# Tier 1: runs on a clean checkout. Network is used only to install locked packages
# (PyPI via uv.lock, npm via package-lock.json). No model weights, datasets, LLM
# endpoints, secrets, or external accounts are used.
# Action refs should be pinned to full commit SHAs before this repository is published
# (tracked in docs/REQUIREMENTS_TRACKER.md).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.13.7"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -p no:warnings
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
