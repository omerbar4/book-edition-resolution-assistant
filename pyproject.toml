[project]
name = "bera"
version = "0.1.0"
description = "Book Edition Resolution Assistant: suggests the most likely Open Library edition for an ISBN or partial book description, and routes uncertain cases to human review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "rapidfuzz>=3.10,<4",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.115,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/bera"]
